# `docker compose up -d` is the whole of the first run on a clean clone. If that
# ever stops being true, it is a defect, not a documentation gap.
services:
  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: proving_ground
      DB_USERNAME: proving_ground
      DB_PASSWORD: proving_ground
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      # Laravel's agent-optimised output replaces PHPUnit's human-readable
      # report with one JSON line. Infection decides a suite passed by looking
      # for "OK (" in that output, so an agent environment variable leaking into
      # this container would silently score every mutant as killed.
      PAO_DISABLE: "1"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      # Readiness means "the HTTP surface answers", not "a process exists".
      # /up returns 200 only if the framework booted without exceptions.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
      start_interval: 1s

  database:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: proving_ground
      MARIADB_USER: proving_ground
      MARIADB_PASSWORD: proving_ground
      MARIADB_ROOT_PASSWORD: proving_ground
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      # --innodb_initialized is the part that matters: --connect alone goes true
      # while the storage engine is still coming up.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  cache:
    image: redis:7-alpine
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  database-data:
  cache-data:
